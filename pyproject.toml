[project]
name = "diffusion-chatbot"
version = "0.1.0"
description = "Masked-diffusion toy chatbot with NumPy CPU and optional CuPy CUDA."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
cuda = [
  "cupy-cuda12x[ctk]>=13,<14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
